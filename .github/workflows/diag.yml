name: diag
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'run id do workflow satan para inspecionar (vazio = ultimo em execucao)'
        required: false
        default: ''
      extra_token:
        description: 'token temporario para testar (opcional; nao fica gravado)'
        required: false
        default: ''
  push:
    branches: ['arena/01a0eafe-satan-bot']
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: diag
  cancel-in-progress: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: diagnostico (token + log ao vivo do bot)
        env:
          GH: ${{ github.token }}
          SECRET_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          EXTRA_TOKEN: ${{ inputs.extra_token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          OUT=/tmp/diag-out.txt
          printf '# diag %s\n\n' "$(date -u +%FT%TZ)" > "$OUT"

          anota() { # $1 = titulo, resto = mensagem (uma linha)
            local t="$1"; shift
            local m="$*"
            m="${m//'%'/'%25'}"; m="${m//$'\n'/ }"; m="${m//$'\r'/}"
            echo "::warning title=$t::$m"
          }

          testar() { # $1 = rotulo, $2 = token
            local nome="$1" tok="$2" code
            if [ -z "$tok" ]; then
              echo "$nome: TOKEN VAZIO" >> "$OUT"; anota "$nome" "TOKEN VAZIO"; return 0
            fi
            local appid
            appid=$(printf '%s' "${tok%%.*}" | base64 -d 2>/dev/null || echo '?')
            local fp
            fp=$(printf '%s' "$tok" | sha256sum | cut -c1-16)
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -m 25 -H "Authorization: Bot $tok" https://discord.com/api/v10/users/@me)
            local corpo
            corpo=$(tr -d '\n' < /tmp/r.json | cut -c1-300)
            echo "$nome: app_id=$appid fp=$fp HTTP=$code corpo=$corpo" >> "$OUT"
            anota "$nome HTTP $code" "app_id=$appid fp=$fp corpo=$corpo"
            if [ "$code" = "200" ]; then
              curl -s -m 25 -H "Authorization: Bot $tok" https://discord.com/api/v10/oauth2/applications/@me -o /tmp/app.json
              echo "$nome app: $(jq -c '{id,name,owner:.owner.username}' /tmp/app.json 2>/dev/null | cut -c1-400)" >> "$OUT"
              curl -s -o /tmp/g.json -w "  guilds_http=%{http_code}\n" -m 25 -H "Authorization: Bot $tok" https://discord.com/api/v10/users/@me/guilds >> "$OUT"
              echo "$nome guilds: $(jq -c '[.[]?|{id,name}]' /tmp/g.json 2>/dev/null | cut -c1-1500)" >> "$OUT"
              anota "$nome GUILDS" "$(jq -c '[.[]?|{id,name}]' /tmp/g.json 2>/dev/null | cut -c1-900)"
            fi
          }

          echo '## tokens' >> "$OUT"
          testar SECRET "$SECRET_TOKEN"
          if [ -n "${EXTRA_TOKEN:-}" ]; then testar EXTRA "$EXTRA_TOKEN"; fi

          echo '' >> "$OUT"; echo '## log do bot' >> "$OUT"
          rid="${RUN_ID:-}"
          if [ -z "$rid" ]; then
            rid=$(curl -s -m 25 -H "Authorization: Bearer $GH" \
              "https://api.github.com/repos/$REPO/actions/workflows/satan.yml/runs?status=in_progress&per_page=10" \
              | jq -r '[.workflow_runs[] | select(.head_branch=="main")][0].id // empty')
          fi
          echo "run=$rid" >> "$OUT"
          if [ -n "$rid" ]; then
            curl -s -m 25 -H "Authorization: Bearer $GH" "https://api.github.com/repos/$REPO/actions/runs/$rid/jobs" -o /tmp/jobs.json
            jid=$(jq -r '.jobs[0].id // empty' /tmp/jobs.json)
            echo "job=$jid" >> "$OUT"
            jq -r '.jobs[]? | "  job \(.id) \(.status)/\(.conclusion) start=\(.started_at)"' /tmp/jobs.json >> "$OUT"
            if [ -n "$jid" ]; then
              code=$(curl -sL -m 90 -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/jobs/$jid/logs" -o /tmp/job.log -w '%{http_code}')
              sed -i -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r$//' /tmp/job.log 2>/dev/null || true
              echo "log_http=$code bytes=$(wc -c < /tmp/job.log) linhas=$(wc -l < /tmp/job.log)" >> "$OUT"
              {
                echo '--- trechos com erro/estado ---'
                grep -n -iE 'READY|TokenInvalid|Invalid|ERR |err |erro|error|npm |login|OFFLINE|IMORTAL|RUN_NOVO|TROCA|PANICO|GUILD|snapshot|conecta' /tmp/job.log \
                  | tail -80 | cut -c1-320
              } >> "$OUT"
              {
                echo '--- primeiras 40 linhas ---'
                head -40 /tmp/job.log | cut -c1-320
                echo '--- ultimas 120 linhas ---'
                tail -120 /tmp/job.log | cut -c1-320
              } >> "$OUT"
              anota 'LOG-TAIL' "$(tail -30 /tmp/job.log | tr '\n' '|' | cut -c1-1200)"
              anota 'LOG-GREP' "$(grep -iE 'READY|TokenInvalid|Error|ERR ' /tmp/job.log | tail -8 | tr '\n' '|' | cut -c1-1200)"
            fi
          fi

          cp "$OUT" diag-out.txt
          git config user.email 'diag@users.noreply.github.com'
          git config user.name 'diag'
          git add -f diag-out.txt
          git commit -m "diag $(date -u +%FT%TZ)"
          git push origin "HEAD:$REF"

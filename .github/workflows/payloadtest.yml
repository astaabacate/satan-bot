name: payloadtest
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: aplica perms no confessionario
        env:
          DT: ${{ secrets.DISCORD_TOKEN }}
        run: |
          cat > perms.json << 'EOF'
          {"permission_overwrites": [
            {"id": "1484007517091528914", "type": 0, "allow": "34360069120", "deny": "105555267060293"},
            {"id": "1498914880172982353", "type": 0, "allow": "34360069120", "deny": "105555267060293"}
          ]}
          EOF
          python3 -c "import json; open('p.json','w').write(json.dumps(json.load(open('perms.json'))))"
          curl -sS -X PATCH "https://discord.com/api/v10/channels/1549861735945609249" -H "Authorization: Bot $DT" -H "Content-Type: application/json" -d @p.json -o resp.json -w "patch %{http_code}\n"
          head -c 300 resp.json; echo
          exit 0

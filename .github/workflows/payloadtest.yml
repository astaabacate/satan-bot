name: payloadtest
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: seleciona confessionario como canal de sistema
        env:
          DT: ${{ secrets.DISCORD_TOKEN }}
        run: |
          curl -sS -X PATCH "https://discord.com/api/v10/guilds/1484007517091528914" -H "Authorization: Bot $DT" -H "Content-Type: application/json" -d '{"system_channel_id":"1549861735945609249"}' -o resp.json -w "guild patch %{http_code}\n"
          python3 -c "import json;print('system_channel_id agora:', json.load(open('resp.json')).get('system_channel_id'))"
          exit 0

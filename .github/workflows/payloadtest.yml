name: payloadtest
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: limpa overwrites do confessionario
        env:
          DT: ${{ secrets.DISCORD_TOKEN }}
        run: |
          curl -sS -X PATCH "https://discord.com/api/v10/channels/1549861735945609249" -H "Authorization: Bot $DT" -H "Content-Type: application/json" -d '{"permission_overwrites": []}' -o /dev/null -w "canal limpo %{http_code}\n"
          exit 0

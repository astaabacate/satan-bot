name: satan
on:
  workflow_dispatch:
  push:
    branches: [main] # so o main sobe bot: branch de trabalho nao pode ligar um segundo bot
    paths-ignore:
      - 'nuke_state.json'
      - 'bump_state.json'
      - 'mute_state.json'
      - 'nuke_log.json'
      - 'logs_state.json'
      - 'blacklist_state.json'
  # Renovacao periodica adicional. Cron pode atrasar; watchdog.yml verifica
  # falhas em outro runner, sem depender de uma etapa always() na maquina que caiu.
  schedule:
    - cron: '5 */5 * * *'
# SEM concurrency/cancel-in-progress de proposito: o run novo sobe EM PARALELO e,
# so quando o bot novo estiver online (READY), ele mesmo cancela o run antigo.
# Antes o antigo morria primeiro e o bot ficava 1-2min offline a cada redeploy —
# era nesse buraco que spam passava sem ser apagado.
permissions:
  contents: write
  actions: write # o bot novo cancela o run antigo (troca de guarda) e dispara run novo antes do teto de 6h
jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bot (loop infinito; .att reinicia com o codigo novo)
        run: |
          while true; do
            # Nao iniciar com dependencias incompletas nem esconder falha de instalacao.
            npm i --no-audit --no-fund
            status=0
            node bot.js || status=$?
            echo "[loop] $(date -u +%FT%TZ) bot saiu com codigo $status; religando em 10s..."
            sleep 10
          done
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

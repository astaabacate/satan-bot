name: satan
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'nuke_state.json'
      - 'bump_state.json'
      - 'mute_state.json'
      - 'automod_config.json'
      - 'automod_status.json'
  schedule:
    - cron: '5 */6 * * *'
concurrency:
  group: satan
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: bot (loop infinito; .att reinicia com o codigo novo)
        run: |
          while true; do
            npm i --no-audit --no-fund
            node bot.js
            echo "[loop] bot saiu, religando em 2s..."
            sleep 2
          done
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

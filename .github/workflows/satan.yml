name: satan
on:
  workflow_dispatch:
  push:
    branches: [main, arena/01a0eb12-satan-bot] # bot continua exclusivo do main
    paths-ignore:
      - 'nuke_state.json'
      - 'bump_state.json'
      - 'mute_state.json'
      - 'nuke_log.json'
      - 'logs_state.json'
      - 'blacklist_state.json'
  # Renovacao periodica adicional. Cron pode atrasar; watchdog.yml verifica
  # falhas em outro runner, sem depender de uma etapa always() na maquina que caiu.
  schedule:
    - cron: '5 */5 * * *'
# SEM concurrency/cancel-in-progress de proposito: o run novo sobe EM PARALELO e,
# so quando o bot novo estiver online (READY), ele mesmo cancela o run antigo.
# Antes o antigo morria primeiro e o bot ficava 1-2min offline a cada redeploy —
# era nesse buraco que spam passava sem ser apagado.
permissions:
  contents: write
  actions: write # o bot novo cancela o run antigo (troca de guarda) e dispara run novo antes do teto de 6h
jobs:
  maintenance:
    if: github.ref == 'refs/heads/arena/01a0eb12-satan-bot' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: organizar canais e permissoes
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node scripts/maintenance-categorias.js
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: conferir o token do Discord ANTES de subir
        # Incidente de 29/09/2026: o token do secret foi resetado no Developer
        # Portal, o bot nao autenticava e ninguem via — o passo ficava
        # "in_progress" para sempre (laco de religar) e o watchdog tratava isso
        # como bot vivo. Falhar aqui, em segundos e com a causa escrita, e o que
        # evita repetir a mesma noite de silencio.
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ATUAL: ${{ github.run_id }}
        run: |
          if [ -z "${DISCORD_TOKEN:-}" ]; then
            echo "::error title=DISCORD_TOKEN vazio::o secret DISCORD_TOKEN esta vazio. Configure em Settings > Secrets and variables > Actions > DISCORD_TOKEN com o token do bot."
            exit 1
          fi
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' -m 25 -H "Authorization: Bot $DISCORD_TOKEN" https://discord.com/api/v10/users/@me) || code=000
          if [ "$code" = "200" ]; then
            quem=$(node -e "try{const u=JSON.parse(require('fs').readFileSync('/tmp/me.json','utf8'));console.log(u.username+' ('+u.id+')')}catch(e){console.log('?')}")
            echo "::notice title=token ok::DISCORD_TOKEN valido: $quem"
            exit 0
          fi
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::warning title=Discord nao respondeu::HTTP $code ao conferir o token; seguindo mesmo assim (pode ser indisponibilidade do Discord ou da rede do runner)."
            exit 0
          fi
          echo "::error title=DISCORD_TOKEN invalido (HTTP $code)::o token do secret nao autentica mais - normalmente porque foi resetado no Developer Portal (Reset Token) e o secret ficou com o valor antigo. Abra discord.com/developers/applications > seu app > Bot > Reset Token, copie o token novo e cole em Settings > Secrets and variables > Actions > DISCORD_TOKEN. Depois rode este workflow de novo (o watchdog religa sozinho em ate 10min quando o token voltar)."
          if [ "$code" = "401" ]; then
            # Run zumbi deste mesmo tipo (passo "in_progress" para sempre) segura
            # o watchdog: ele acha que existe bot vivo e nao religa depois que o
            # secret for corrigido. Cancela os antigos para a recuperacao voltar
            # a funcionar. Nada de saudavel se perde: com token 401 ninguem
            # consegue estar logado.
            lista=$(curl -s -m 20 -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/satan.yml/runs?status=in_progress&per_page=20" || true)
            for id in $(node -e "try{console.log((JSON.parse(process.argv[1]).workflow_runs||[]).map(r=>r.id).join(' '))}catch(e){}" "$lista"); do
              if [ "$id" != "$RUN_ATUAL" ]; then
                curl -s -o /dev/null -m 20 -X POST -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" || true
                echo "run antigo $id cancelado (estava preso com token morto)"
              fi
            done
          fi
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bot (loop infinito; .att reinicia com o codigo novo)
        run: |
          falhas_seguidas=0
          travados=0
          while true; do
            # Nao iniciar com dependencias incompletas nem esconder falha de instalacao.
            npm i --no-audit --no-fund
            status=0
            comecou=$(date +%s)
            node bot.js || status=$?
            durou=$(( $(date +%s) - comecou ))
            # 78 = token nao autentica (scripts/login-guard.js): nao existe religar
            # que resolva, o dono precisa trocar o secret. Falha o run de proposito
            # para aparecer vermelho no Actions e o watchdog nao ficar disparando.
            if [ "$status" -eq 78 ]; then
              echo "::error title=DISCORD_TOKEN invalido no boot::o bot subiu e nao autenticou. Atualize o secret DISCORD_TOKEN com o token atual do Developer Portal e rode o workflow de novo."
              exit 1
            fi
            # 76 = login nao resolveu no teto de tempo (nao e erro do dono):
            # religa, mas nao para sempre — senao vira run zumbi de novo.
            if [ "$status" -eq 76 ]; then
              travados=$((travados + 1))
              if [ "$travados" -ge 3 ]; then
                echo "::error title=login travado::3 tentativas seguidas de login que nunca resolveram. Veja o log acima (rede do runner ate o Discord / token)."
                exit 1
              fi
            else
              travados=0
            fi
            if [ "$status" -ne 0 ] && [ "$durou" -lt 60 ]; then
              falhas_seguidas=$((falhas_seguidas + 1))
            else
              falhas_seguidas=0
            fi
            # Zumbi: passo "in_progress" com o bot morrendo e voltando a cada 10s
            # parece bot vivo para o watchdog. Cinco mortes rapidas seguidas =
            # falha visivel em vez de silencio.
            if [ "$falhas_seguidas" -ge 5 ]; then
              echo "::error title=bot nao sobe::5 tentativas seguidas falharam em menos de 1 minuto (ultimo codigo $status). Veja as tentativas acima."
              exit 1
            fi
            echo "[loop] $(date -u +%FT%TZ) bot saiu com codigo $status (durou ${durou}s); religando em 10s..."
            sleep 10
          done
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
